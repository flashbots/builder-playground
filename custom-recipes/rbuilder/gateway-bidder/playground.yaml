base: l1
description: rbuilder + bidding-gateway + real bidding-service from rbuilder-bidding-service repo

recipe:
  reth:
    services:
      el:
        release:
          name: "reth"
          org: "paradigmxyz"
          version: "v1.9.3"

  builder:
    services:
      rbuilder:
        host_path: "~/rbuilder-prism/target/release/rbuilder"
        args:
          - "run"
          - "rbuilder.toml"
        files:
          "rbuilder.toml": "rbuilder.toml"
        depends_on:
          - "el:healthy"
          - "beacon:healthy"
          - "bidding-gateway:running"

  gateway:
    services:
      bidding-service:
        host_path: "~/rbuilder-bidding-service/target/release/bidding-service"
        args:
          - "bidder.toml"
        files:
          "bidder.toml": "bidder.toml"
      bidding-gateway:
        host_path: "~/rbuilder-prism/target/release/bidding-gateway"
        args:
          - "--config"
          - "gateway.toml"
        files:
          "gateway.toml": "gateway.toml"
        depends_on:
          - "bidding-service:running"
          - "mev-boost-relay:running"
          - "el:healthy"
