log_json = false
log_level = "info,rbuilder=debug,eth_sparse_mpt=debug"
redacted_telemetry_server_port = 6061
redacted_telemetry_server_ip = "0.0.0.0"
full_telemetry_server_port = 6060
full_telemetry_server_ip = "0.0.0.0"

# paths relative to artifacts directory
chain = "genesis.json"
reth_datadir = "volume-el-data"
el_node_ipc_path = "volume-el-data/reth.ipc"

# ethereum private key for coinbase (receives builder fees)
# first prefunded account (0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266);
# must match the gateway's coinbase_secret_key — the gateway re-signs the
# payout from the same account the builder simulated with
coinbase_secret_key = "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

# BLS secret key for signing relay submissions
relay_secret_key = "0x25295f0d1d592a90b333e26e85149708208e9f8e8bc18f6c77bd62f8ad7a6866"

cl_node_url = ["http://localhost:3500"]
jsonrpc_server_port = 8645
jsonrpc_server_ip = "0.0.0.0"
extra_data = "Playground Builder ⚡🤖"

ignore_cancellable_orders = true

# required sparse trie settings; v2 is required for gateway payout-proof capture
root_hash_use_sparse_trie = true
root_hash_compare_sparse_trie = false
root_hash_sparse_trie_version = "v2"

# start bidding immediately
slot_delta_to_start_bidding_ms = -20000

live_builders = ["mp-ordering"]

# gateway mode: ship prefinalized blocks to the bidding gateway instead of
# submitting to relays directly; slot info comes from the gateway passthrough
# 127.0.0.1, not localhost: msg-rs resolves localhost to ::1 and the gateway
# listens on ipv4 only — the connect retries forever and wedges the forwarder
[[bidding_gateways]]
name = "playground"
url = "127.0.0.1:6072"
slot_info_url = "http://127.0.0.1:6071"

[[builders]]
name = "mp-ordering"
algo = "ordering-builder"
discard_txs = true
sorting = "max-profit"
failed_order_retries = 1
drop_failed_orders = true
