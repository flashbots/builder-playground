# bidding-gateway server config (rbuilder gateway perf setup)

# msg-rs socket builders ship prefinalized blocks to
listen_addr = "0.0.0.0:6072"
# prometheus at /debug/metrics/prometheus
metrics_addr = "0.0.0.0:6065"
# slot-info passthrough served to builders (GET /relay/v1/builder/validators)
relay_api_addr = "0.0.0.0:6071"
# unix socket of the tbv bidding service
bidding_service_ipc_path = "/tmp/playground-bidding.sock"

# path relative to artifacts directory
chain = "genesis.json"
# playground devnet genesis fork version (gateway has no CL to fetch it from)
genesis_fork_version = "0x20000089"

# must match the builder's coinbase_secret_key (payout re-sign + proofs)
coinbase_secret_key = "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
relay_secret_key = "0x25295f0d1d592a90b333e26e85149708208e9f8e8bc18f6c77bd62f8ad7a6866"

extra_data = "Playground Gateway ⚡"

# reth websocket, for landed-block tracking
el_rpc_ws_url = "ws://localhost:8546"

log_level = "info,rbuilder=debug"
log_color = true

[[relays]]
name = "playground"
url = "http://localhost:5555"
priority = 0
use_ssz_for_submit = false
use_gzip_for_submit = false
mode = "full"
