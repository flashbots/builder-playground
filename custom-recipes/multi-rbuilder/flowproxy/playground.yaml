  contender:
    services:
      contender-1:
        image: flashbots/contender
        tag: 0.7.2
        args:
          - spam
          - --optimistic-nonces
          - --ignore-receipts
          - --duration
          - "86400"
          - --override-senders
          - --priv-key
          - "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
          - --min-balance
          - 100 ether
          - -r
          - '{{Service "el" "http" "http" ""}}'
          - transfers
          - --tps
          - "20"
        depends_on:
