          - relay-delay-3:running

  flowproxy:
    services:
      flowproxy-1:
        image: builder-playground/flowproxy
        tag: local
        args:
          - --user-listen-addr
          - 0.0.0.0:9754
          - --system-listen-addr
          - 0.0.0.0:9755
          - --builder-listen-addr
          - 0.0.0.0:9756
          - --builder-url
          - http://rbuilder-1:8645
          - --builder-name
          - rbuilder-1
          - --builder-region
          - us
          - --metrics
          - 0.0.0.0:9760
          - --disable-forwarding
          - --http.enable-gzip
        ports:
