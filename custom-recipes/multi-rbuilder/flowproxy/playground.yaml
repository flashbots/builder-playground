  builder-beacon:
    services:
      beacon-builder-1:
        image: sigp/lighthouse
        tag: v8.1.0
        entrypoint: lighthouse
        args:
          - bn
          - --datadir
          - /data_beacon
          - --testnet-dir
          - /data/testnet-dir
          - --enable-private-discovery
          - --disable-peer-scoring
          - --staking
          - --enr-address
          - 127.0.0.1
          - --enr-udp-port
          - '{{PortUDP "p2p" 9000}}'
          - --enr-tcp-port
          - '{{Port "p2p" 9000}}'
          - --enr-quic-port
          - '{{Port "quic-p2p" 9100}}'
          - --port
          - '{{Port "p2p" 9000}}'
          - --quic-port
          - '{{Port "quic-p2p" 9100}}'
          - --http
          - --http-port
          - '{{Port "http" 3500}}'
          - --http-address
          - 0.0.0.0
          - --http-allow-origin
          - '*'
          - --disable-packet-filter
          - --target-peers
          - "1"
          - --libp2p-addresses
          - /dns4/beacon/tcp/9000
          - --checkpoint-sync-url
          - http://beacon:3500
          - --execution-endpoint
          - '{{Service "el-builder-1" "authrpc" "http" ""}}'
          - --execution-jwt
          - /data/jwtsecret
          - --always-prepare-payload
          - --prepare-payload-lookahead
          - "8000"
          - --suggested-fee-recipient
          - 0x690B9A9E9aa1C9dB991C7721a92d351Db4FaC990
          - --builder
          - '{{Service "mev-boost-relay" "http" "http" ""}}'
          - --builder-fallback-epochs-since-finalization
          - "0"
          - --builder-fallback-disable-checks
        ports:
          http: 3500
          p2p: 9000
          quic-p2p: 9100
        files:
          /data/jwtsecret: artifact:jwtsecret
          /data/testnet-dir: artifact:testnet
        volumes:
          /data_beacon:
            name: data
            is_local: false
        depends_on:
          - el-builder-1:running
          - beacon:healthy
