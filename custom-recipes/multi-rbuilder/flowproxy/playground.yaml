  builders:
    services:
      bidding-gateway:
        image: builder-playground/rbuilder-wrapper
        tag: local
        entrypoint: /app/bidding-gateway
        args:
          - /data/rbuilder-gateway.toml
          - --listen-address
          - 0.0.0.0:6072
        files:
          /data/rbuilder-gateway.toml: rbuilder-gateway.toml
        ports:
          http: 6072
        depends_on:
          - mev-boost-relay:running
      rbuilder-1:
        image: builder-playground/rbuilder-wrapper
        tag: local
        entrypoint: /bin/busybox
        pid: "service:el"
        args:
          - sh
          - -c
          - /bin/busybox sleep 20 && exec /app/rbuilder run /data/rbuilder.toml
        files:
          /data/rbuilder.toml: rbuilder-1.toml
          /data/genesis.json: artifact:genesis.json
        volumes:
          /data_reth:
            name: "shared:el-data"
            is_local: true
        depends_on:
          - el:running
          - beacon:healthy
          - bidding-gateway:running
      rbuilder-2:
        image: builder-playground/rbuilder-wrapper
        tag: local
        entrypoint: /bin/busybox
        pid: "service:el"
        args:
          - sh
          - -c
