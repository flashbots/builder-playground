base: l1
description: L1 relay bidding scenario with three rbuilders, one bidding gateway, flowproxy, contender load, and 50ms relay latency for non-gateway builders

base_args:
  - --block-time
  - 3s

setup:
  - docker build -t builder-playground/relay-delay-proxy:local -f Dockerfile.relay-delay-proxy .
  - docker build -t builder-playground/rbuilder-wrapper:local -f Dockerfile.rbuilder-wrapper ../../../../rbuilder-prism
  - docker build -t builder-playground/flowproxy-build:local -f ../../../../flowproxy-private/Dockerfile.reproducible ../../../../flowproxy-private
  - docker build -t builder-playground/flowproxy:local -f Dockerfile.flowproxy-wrapper .

recipe:
  relay-delay:
    services:
      relay-delay-1:
        image: builder-playground/relay-delay-proxy
        tag: local
        env:
          UPSTREAM: http://mev-boost-relay:5555
          LATENCY_MS: "50"
          LISTEN_PORT: "5555"
        ports:
          http: 5555
        ready_check: http://localhost:5555/health
        depends_on:
          - mev-boost-relay:running
      relay-delay-2:
        image: builder-playground/relay-delay-proxy
        tag: local
        env:
          UPSTREAM: http://mev-boost-relay:5555
          LATENCY_MS: "50"
          LISTEN_PORT: "5555"
        ports:
          http: 5555
        ready_check: http://localhost:5555/health
        depends_on:
          - mev-boost-relay:running
      relay-delay-3:
        image: builder-playground/relay-delay-proxy
        tag: local
        env:
          UPSTREAM: http://mev-boost-relay:5555
          LATENCY_MS: "50"
          LISTEN_PORT: "5555"
        ports:
          http: 5555
        ready_check: http://localhost:5555/health
        depends_on:
          - mev-boost-relay:running

  builder-execution:
    services:
      el-builder-1:
        image: ghcr.io/paradigmxyz/reth
        tag: v1.9.3
        entrypoint: /usr/local/bin/reth
        args:
          - node
          - --chain
          - /data/genesis.json
          - --datadir
          - /data_reth
          - --color
          - never
          - --addr
          - 0.0.0.0
          - --port
          - '{{Port "rpc" 30303}}'
          - --ipcpath
          - /data_reth/reth.ipc
          - --http
          - --http.addr
          - 0.0.0.0
          - --http.api
          - admin,eth,web3,net,rpc,mev,flashbots
          - --http.port
          - '{{Port "http" 8545}}'
          - --ws
          - --ws.addr
          - 0.0.0.0
          - --ws.port
          - '{{Port "ws" 8546}}'
          - --ws.api
          - eth,web3,net,txpool,debug,trace
          - --ws.origins
          - '*'
          - --authrpc.port
          - '{{Port "authrpc" 8551}}'
          - --authrpc.addr
          - 0.0.0.0
          - --authrpc.jwtsecret
          - /data/jwtsecret
          - --metrics
          - 0.0.0.0:{{Port "metrics" 9090}}
          - --engine.persistence-threshold
          - "0"
          - --engine.memory-block-buffer-target
          - "0"
          - -vvv
          - --disable-discovery
        ports:
          authrpc: 8551
          http: 8545
          metrics: 9090
          rpc: 30303
          ws: 8546
        files:
          /data/genesis.json: artifact:genesis.json
          /data/jwtsecret: artifact:jwtsecret
        volumes:
          /data_reth:
            name: data
            is_local: true
